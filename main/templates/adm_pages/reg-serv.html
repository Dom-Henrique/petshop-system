<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="../static/css/prod-serv.css">
    <link rel="icon" type="image/x-icon" href="../static/images/Software Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <button class="logo"><i class="fa-solid fa-bone"></i></button>
            <ul class="options">
                <li><a href="{{ url_for('home') }}">Início</a></li>
                <li><a href="{{ url_for('products') }}">Produtos</a></li>
                <li><a href="{{ url_for('home') }}">Categorias</a></li>
                <li><a href="{{ url_for('services') }}">Serviços</a></li>
                <li><a href="">Nossos Profissionais</a></li>
            </ul>
            <button class="menu"><i class="fa-solid fa-bars"></i></button>
        </nav>
    </header>
    <main>
        <form class="services" method="POST" id="services">
            <h1>Cadastrar Serviço</h1>
            <section class="form">
                <div class="serv-name">
                    <label>Nome do serviço</label>
                    <input type="text" id="service_name" name="service_name">
                </div>
                <div class="serv-desc">
                    <label>Descrição do serviço</label>
                    <textarea minlength="200px" id="product_desc" name="service_desc"></textarea>
                </div>
                <div class="serv-img">
                    <label for="">Imagem do serviço</label>
                    <input type="file" name="service_img" id="serv-img">
                </div>
                <div class="category">
                    <label for="">Categoria</label>
                    <input type="search" id="category" name="category">
                </div>
                <div class="professional">
                    <label for="">Profissional</label>
                    <select name="professional" id="professional">
                        <!--Um laço de repetição iria percorrer todos os valores da tabela criada e depois mostraria os opções-->
                        {%for p in profs_names%}
                            <option value="professionals">{{p.prof_name}}</option>
                        {%endfor%}
                        
                    </select>
                </div>
                <div class="price">
                    <label for="">Preço</label>
                    <input type="number" inputmode="decimal" step="0.10" min="0.00" name="service_price">
                </div>
                <div class="hour">
                    <label for="">Horário</label>
                    <input type="time" name="" id="" name="hour">
                </div>
            </section>
            <div class="send-bt">
                <button>Cadastrar</button>
            </div>
        </form>
    </main>
</body>

</html>
