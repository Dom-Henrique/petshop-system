<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissionais</title>
    <link rel="stylesheet" href="../../static/css/prod-serv.css">
    <link rel="icon" type="image/x-icon" href="../static/images/Software Logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <button class="logo"><i class="fa-solid fa-bone"></i></button>
            <ul class="options">
                <li><a href="{{ url_for('home') }}">Início</a></li>
                <li><a href="{{ url_for('products') }}">Produtos</a></li>
                <li><a href="{{ url_for('home') }}">Categorias</a></li>
                <li><a href="{{ url_for('services') }}">Serviços</a></li>
                <li><a href="">Nossos Profissionais</a></li>
            </ul>
            <button class="menu"><i class="fa-solid fa-bars"></i></button>
        </nav>
    </header>
    <main>
        <form method="POST" enctype="multipart/form-data" class="professionals">
            <div class="form-group">
                <label for="prof_name">Nome do Profissional:</label>
                <input type="text" id="prof_name" name="prof_name" required>
            </div>

            <div class="form-group">
                <label for="prof_ocupation">Ocupação:</label>
                <input type="text" id="prof_ocupation" name="prof_ocupation" required>
            </div>
            <div class="form-group">
                <label for="">Foto:</label>
                <input type="file" name="prof_img" id="prof_img" accept="image/*">
            </div>
            <button type="submit" onclick="unhideButton()">Cadastrar</button>
        </form>
    </main>
</body>

</html>
